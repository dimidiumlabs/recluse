min_version = "2026.7.5"

[settings]
experimental = true

[tools]
"aqua:taiki-e/cargo-llvm-cov" = "0.8.7"
"cargo:cargo-about" = "0.8.4"
gh = "2.96.0"
jq = "1.8.2"
rust = { version = "1.97.1", profile = "minimal", components = [ "clippy", "llvm-tools-preview", "rustfmt" ] }
shellcheck = "0.11.0"

[bootstrap.packages]
# APT
"apt:apt-utils" = "latest"
"apt:build-essential" = "latest"
"apt:debsigs" = "latest"
"apt:createrepo-c" = "latest"
"apt:gnupg" = "latest"
"apt:libssl-dev" = "latest"
"apt:pkg-config" = "latest"
"apt:rpm" = "latest"

# DNF
"dnf:createrepo_c" = "latest"
"dnf:gcc" = "latest"
"dnf:gnupg2" = "latest"
"dnf:openssl-devel" = "latest"
"dnf:pkgconf-pkg-config" = "latest"
"dnf:rpm" = "latest"

[task_config]
dir = "{{cwd}}"
includes = [
  "git::https://github.com/dimidiumlabs/platform.git//tasks?ref=159ce265b95d655342c378d9aaa7dc14dbf1dfa4",
]

[tasks.fmt]
run = "cargo fmt --all --check"

[tasks.clippy]
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
run = """
cargo build --release
cargo test --all-features --release --locked
"""

[tasks.smoke]
run = "cargo run -p smoke"

[tasks.smoke-local]
run = "./tests/smoke/run-local.sh"

[tasks.coverage]
run = """
mkdir -p target/coverage/
cargo llvm-cov --all-features --workspace --lcov --output-path target/coverage/lcov.info
cargo llvm-cov --all-features --workspace --html --output-dir target/coverage/html
"""
